<style>
  :root{
    --ink:#1B231E;
    --ink-soft:#4A5750;
    --paper:#F3F5EF;
    --paper-raised:#FBFCF9;
    --green-deep:#1E4B3A;
    --green-credit:#2E7D53;
    --red-debit:#B3452F;
    --gold-rule:#A8823C;
    --line:rgba(30,75,58,0.14);
    --stripe:rgba(30,75,58,0.045);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'IBM Plex Mono','SF Mono', monospace;
    --largeur-contenu-pc:680px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button{ touch-action:manipulation; font-family:inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--gold-rule); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }

  .chargement{
    display:flex; align-items:center; justify-content:center;
    height:100vh; height:100dvh;
    font-family:var(--font-display); color:var(--green-deep); font-size:15px;
  }

  .app{
    max-width:520px; margin:0 auto;
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    position:relative; overflow:hidden;
    transform:translateZ(0);
    background:var(--paper);
  }

  .entete{ padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 2px; text-align:center; flex-shrink:0; }
  .entete-eyebrow{ font-family:var(--font-display); font-size:22px; font-weight:600; margin:0; color:var(--green-deep); }
  .entete-marque{ display:flex; align-items:center; justify-content:center; gap:8px; }
  .entete-icone{ width:26px; height:26px; display:block; }
  .entete-souscription{ font-size:12.5px; color:var(--ink-soft); margin:2px 0 0; font-style:italic; font-family:var(--font-display); }

  .selecteur-periode{ display:flex; gap:8px; padding:10px 20px 6px; justify-content:center; flex-shrink:0; overflow-x:auto; scrollbar-width:none; }
  .selecteur-periode::-webkit-scrollbar{ display:none; }
  .chip-periode{ font-family:var(--font-body); font-size:12.5px; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--paper-raised); color:var(--ink-soft); cursor:pointer; white-space:nowrap; flex-shrink:0; }
  .chip-periode.actif{ background:var(--green-deep); border-color:var(--green-deep); color:var(--paper); }

  .contenu{ flex:1; padding:8px 20px 110px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .vue{ display:none; }
  .vue--active{ display:block; }

  .hero-solde{ text-align:center; padding:6px 0 20px; }
  .eyebrow{ font-family:var(--font-body); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 6px; }
  .hero-chiffre{ font-family:var(--font-display); font-size:42px; font-weight:600; margin:0; font-variant-numeric:tabular-nums; letter-spacing:-0.01em; }
  .hero-solde-date{ font-size:11.5px; color:var(--ink-soft); margin:2px 0 0; }
  .ink-credit{ color:var(--green-credit); }
  .ink-debit{ color:var(--red-debit); }
  .double-regle{ width:120px; height:9px; margin:10px auto 0; position:relative; }
  .double-regle::before, .double-regle::after{ content:''; position:absolute; left:0; right:0; height:2px; background:var(--gold-rule); }
  .double-regle::before{ top:0; }
  .double-regle::after{ top:7px; }
  @media (prefers-reduced-motion: no-preference){
    .hero-chiffre, .eyebrow{ animation:apparition .6s ease both; }
    .double-regle{ animation:elargir .7s .15s cubic-bezier(.2,.8,.2,1) both; }
  }
  @keyframes apparition{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes elargir{ from{ width:0; opacity:0; } to{ width:120px; opacity:1; } }

  .grille-stats{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
  .carte-stat, .carte-epargne, .carte-optim, .bloc-reglage{
    background:var(--paper-raised); border-radius:14px; padding:14px 16px;
    box-shadow:0 1px 2px rgba(27,35,30,0.05), 0 6px 16px rgba(27,35,30,0.05);
  }
  .carte-stat-label{ font-size:11px; color:var(--ink-soft); margin:0 0 4px; text-transform:uppercase; letter-spacing:.06em; }
  .carte-stat-valeur{ font-family:var(--font-mono); font-size:17px; font-weight:600; margin:0; font-variant-numeric:tabular-nums; }

  .section-titre{ font-family:var(--font-display); font-size:18px; font-weight:600; margin:16px 0 10px; color:var(--ink); }
  .section-titre-ligne{ display:flex; align-items:baseline; justify-content:space-between; }
  .lien-voir-tout{ background:none; border:none; color:var(--green-deep); font-size:13px; cursor:pointer; padding:4px; }
  .entete-vue{ display:flex; align-items:center; justify-content:space-between; }

  .liste-mvts{ background:var(--paper-raised); border-radius:14px; overflow:hidden; box-shadow:0 1px 2px rgba(27,35,30,0.05), 0 6px 16px rgba(27,35,30,0.05); }
  .ligne-mvt{ width:100%; display:flex; align-items:center; gap:12px; padding:12px 14px; border:none; border-bottom:1px solid var(--line); background:var(--paper-raised); text-align:left; cursor:pointer; }
  .ligne-mvt:nth-child(even){ background:var(--stripe); }
  .ligne-mvt:last-child{ border-bottom:none; }
  .ligne-mvt-tick{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .ligne-mvt-corps{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .ligne-mvt-titre{ font-size:14.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ligne-mvt-sous{ font-size:12px; color:var(--ink-soft); }
  .marque-avenir{ color:var(--gold-rule); font-weight:500; }
  .marque-recurrent{ color:var(--ink-soft); }
  .ligne-mvt-montant{ font-family:var(--font-mono); font-size:14.5px; font-weight:500; font-variant-numeric:tabular-nums; flex-shrink:0; }

  .filtres-mouvements{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .segment-type.segment-type--compact button{ font-size:12.5px; padding:9px 4px; }
  .select-filtre{ width:100%; font-family:var(--font-body); font-size:14px; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--paper-raised); color:var(--ink); }

  .conteneur-donut{ position:relative; width:196px; height:196px; margin:10px auto 20px; }
  .conteneur-donut svg{ width:100%; height:100%; }
  .donut-centre{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .donut-centre-label{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; }
  .donut-centre-valeur{ font-family:var(--font-mono); font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:2px; }

  .liste-repartition{ display:flex; flex-direction:column; background:var(--paper-raised); border-radius:14px; overflow:hidden; box-shadow:0 1px 2px rgba(27,35,30,0.05), 0 6px 16px rgba(27,35,30,0.05); }
  .ligne-repartition{ display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .ligne-repartition:last-child{ border-bottom:none; }
  .ligne-repartition-nom{ flex:1; }
  .ligne-repartition-montant{ font-family:var(--font-mono); color:var(--ink-soft); font-variant-numeric:tabular-nums; font-size:13px; }
  .ligne-repartition-pct{ font-family:var(--font-mono); font-weight:600; width:50px; text-align:right; font-variant-numeric:tabular-nums; }

  .carte-epargne{ margin-bottom:16px; text-align:left; border-left:3px solid var(--green-credit); }
  .carte-epargne--attention{ border-left-color:var(--red-debit); }
  .carte-epargne-valeur{ font-family:var(--font-display); font-size:25px; font-weight:600; margin:2px 0 6px; font-variant-numeric:tabular-nums; }
  .carte-epargne-objectif{ font-family:var(--font-body); font-size:13px; color:var(--ink-soft); font-weight:400; margin-left:6px; }
  .carte-epargne-message{ font-size:13px; color:var(--ink-soft); margin:0; }

  .liste-optimisation{ display:flex; flex-direction:column; gap:10px; }
  .carte-optim{ border-left:3px solid var(--line); }
  .carte-optim--depasse{ border-left-color:var(--red-debit); }
  .carte-optim--ok{ border-left-color:var(--green-credit); }
  .carte-optim-entete{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .carte-optim-nom{ flex:1; font-size:14px; font-weight:500; }
  .carte-optim-pct{ font-family:var(--font-mono); font-size:13.5px; font-weight:600; font-variant-numeric:tabular-nums; }
  .carte-optim-objectif{ font-weight:400; color:var(--ink-soft); }
  .barre-progression{ position:relative; height:7px; background:var(--line); border-radius:4px; margin-bottom:8px; }
  .barre-progression-remplissage{ position:absolute; left:0; top:0; bottom:0; border-radius:4px; }
  .barre-progression-marqueur{ position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--gold-rule); }
  .carte-optim-message{ font-size:12.5px; color:var(--ink-soft); margin:0; }
  .note-optimisation{ font-size:12px; color:var(--ink-soft); text-align:center; margin:18px 0 4px; }

  .bloc-reglage{ margin-bottom:16px; }
  .sous-titre{ font-family:var(--font-display); font-size:15px; font-weight:600; margin:0 0 10px; }
  .aide-texte{ font-size:12px; color:var(--ink-soft); margin:-4px 0 10px; }
  .ligne-objectif-epargne{ display:flex; align-items:center; gap:6px; }
  .input-nombre{ width:70px; font-family:var(--font-mono); font-size:15px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--paper); color:var(--ink); }
  .unite{ color:var(--ink-soft); font-size:13px; }
  .liste-categories{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .ligne-categorie{ display:flex; align-items:center; gap:8px; }
  .input-cat-nom{ flex:1; min-width:0; font-family:var(--font-body); font-size:13.5px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--paper); color:var(--ink); }
  .input-cat-objectif{ width:52px; font-family:var(--font-mono); font-size:13.5px; padding:8px 6px; border-radius:8px; border:1px solid var(--line); background:var(--paper); color:var(--ink); text-align:right; }
  .input-cat-objectif:disabled{ background:var(--stripe); color:var(--ink-soft); border-style:dashed; }
  .bouton-supprimer-cat{ background:none; border:none; color:var(--ink-soft); font-size:15px; cursor:pointer; padding:4px 6px; }
  .bouton-secondaire{ display:block; width:100%; padding:11px; border-radius:10px; border:1px solid var(--green-deep); background:none; color:var(--green-deep); font-size:13.5px; font-weight:500; cursor:pointer; margin-top:4px; }
  .actions-donnees{ display:flex; gap:8px; margin-bottom:12px; }
  .actions-donnees .bouton-secondaire{ margin-top:0; }
  .bouton-danger{ display:block; width:100%; padding:11px; border-radius:10px; border:1px solid var(--red-debit); background:none; color:var(--red-debit); font-size:13.5px; font-weight:500; cursor:pointer; }

  .liste-archives{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .ligne-archive{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:10px 12px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .ligne-archive--archivee{ flex-direction:column; align-items:stretch; }
  .ligne-archive-entete{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:none; border:none; padding:0; width:100%; cursor:pointer; font-family:inherit; text-align:left; }
  .ligne-archive-annee{ font-family:var(--font-display); font-size:14.5px; font-weight:600; color:var(--ink); }
  .etiquette-archivee{ font-family:var(--font-body); font-size:10px; font-weight:500; color:var(--ink-soft); background:var(--stripe); padding:2px 7px; border-radius:999px; margin-left:4px; }
  .ligne-archive-info{ font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); flex-shrink:0; font-variant-numeric:tabular-nums; }
  .ligne-archive--archivee .bouton-secondaire{ margin-top:10px; }
  .detail-archive{ margin-top:10px; border-top:1px solid var(--line); padding-top:10px; }
  .detail-archive .liste-mvts{ box-shadow:none; }
  .detail-archive .ligne-mvt{ cursor:default; pointer-events:none; }
  .detail-compte{ margin-top:10px; border-top:1px solid var(--line); padding-top:10px; }
  .detail-compte .liste-mvts{ box-shadow:none; }
  .ligne-mvt--compte{ cursor:default; }

  .etat-vide{ text-align:center; padding:40px 20px; color:var(--ink-soft); }
  .etat-vide p{ margin:4px 0; }
  .etat-vide-sous{ font-size:13px; }

  .fab{
    position:fixed; right:20px; bottom:calc(78px + env(safe-area-inset-bottom,0px));
    width:56px; height:56px; border-radius:50%;
    background:var(--green-deep); color:var(--paper); font-size:28px; line-height:1;
    border:none; box-shadow:0 4px 14px rgba(30,75,58,0.35);
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:20;
  }

  .tabbar{ position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--paper-raised); border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px)); z-index:15; }
  .tab-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--ink-soft); padding:6px 2px; cursor:pointer; }
  .tab-btn.actif{ color:var(--green-deep); }
  .tab-icone-svg{ width:22px; height:22px; stroke:currentColor; stroke-width:1.7; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .tab-label{ font-size:10px; font-weight:500; }

  .modal{ position:fixed; inset:0; z-index:30; pointer-events:none; visibility:hidden; }
  .modal--ouvert{ pointer-events:auto; visibility:visible; }
  .modal-overlay{ position:absolute; inset:0; background:rgba(27,35,30,0.4); opacity:0; transition:opacity .25s ease; }
  .modal--ouvert .modal-overlay{ opacity:1; }
  .modal-feuille{ position:absolute; left:0; right:0; bottom:0; background:var(--paper); border-radius:20px 20px 0 0; padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px)); max-height:88%; overflow-y:auto; transform:translateY(100%); transition:transform .3s cubic-bezier(.2,.8,.2,1); box-shadow:0 -8px 24px rgba(0,0,0,.15); }
  .modal--ouvert .modal-feuille{ transform:translateY(0); }
  .modal-poignee{ width:36px; height:4px; background:var(--line); border-radius:2px; margin:8px auto 6px; }
  .modal-entete{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-entete h3{ font-family:var(--font-display); font-size:18px; margin:0; }
  .bouton-icone{ background:none; border:none; font-size:16px; color:var(--ink-soft); cursor:pointer; padding:6px; }

  .form-transaction{ display:flex; flex-direction:column; gap:14px; }
  .segment-type{ display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .segment-type button{ flex:1; padding:10px; background:var(--paper-raised); border:none; font-size:14px; color:var(--ink-soft); cursor:pointer; }
  .segment-type button.actif{ background:var(--green-deep); color:var(--paper); }
  .etiquette-champ{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--ink-soft); }
  .input-montant-champ, .input-texte, .input-select{ font-family:var(--font-mono); font-size:16px; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--paper-raised); color:var(--ink); }
  .input-select{ font-family:var(--font-body); }
  .bouton-principal{ padding:13px; border-radius:10px; border:none; background:var(--green-deep); color:var(--paper); font-size:15px; font-weight:600; cursor:pointer; margin-top:4px; }

  .toast{ position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom,0px)); transform:translate(-50%, 12px); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:40; white-space:nowrap; max-width:88%; overflow:hidden; text-overflow:ellipsis; }
  .toast--visible{ opacity:1; transform:translate(-50%, 0); }

  /* Grands écrans (PC/tablette) : l'appli occupe tout l'écran ; le contenu reste centré dans une colonne lisible */
  @media (min-width: 700px){
    .app{
      max-width:none;
      width:100%;
    }
    .vue{
      max-width:var(--largeur-contenu-pc);
      margin-left:auto;
      margin-right:auto;
    }
    .fab{
      right:max(20px, calc((100% - var(--largeur-contenu-pc)) / 2 + 20px));
    }
    .modal-feuille{
      left:50%; right:auto;
      width:100%; max-width:460px;
      border-radius:20px 20px 0 0;
      transform:translate(-50%, 100%);
    }
    .modal--ouvert .modal-feuille{
      transform:translate(-50%, 0);
    }
  }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  "use strict";

  var CATEGORIES_SORTIE_DEFAUT = [
    {id:'logement', nom:'Logement', couleur:'#2B5F6B', objectif:30},
    {id:'alimentation', nom:'Alimentation', couleur:'#B8863C', objectif:15},
    {id:'transport', nom:'Transport', couleur:'#4A5C8A', objectif:15},
    {id:'assurances', nom:'Assurances', couleur:'#7A4C6D', objectif:5},
    {id:'sante', nom:'Santé', couleur:'#6E8C5A', objectif:5},
    {id:'loisirs', nom:'Loisirs & sorties', couleur:'#C4703F', objectif:10},
    {id:'abonnements', nom:'Abonnements', couleur:'#6B8CAE', objectif:5},
    {id:'epargne', nom:'Épargne', couleur:'#1E4B3A', objectif:10},
    {id:'autres', nom:'Autres', couleur:'#8A7F6E', objectif:5},
    {id:'virements', nom:'Virements', couleur:'#6B6E8C', objectif:15}
  ];
  var CATEGORIES_ENTREE_DEFAUT = [
    {id:'salaire', nom:'Salaire', couleur:'#1E4B3A'},
    {id:'primes', nom:'Primes', couleur:'#2E7D53'},
    {id:'remboursements', nom:'Remboursements', couleur:'#6B8CAE'},
    {id:'autres-revenus', nom:'Autres revenus', couleur:'#8A7F6E'},
    {id:'virements', nom:'Virements', couleur:'#6B6E8C'}
  ];
  var PALETTE_CATEGORIES = ['#2B5F6B','#B8863C','#4A5C8A','#7A4C6D','#6E8C5A','#C4703F','#6B8CAE','#1E4B3A','#8A7F6E'];
  var LIBELLES_FREQUENCE = {hebdomadaire:'hebdo', mensuel:'mensuel', trimestriel:'trim.', semestriel:'semestre', annuel:'annuel'};
  var LIBELLES_FILTRE_RECURRENCE = {toutes:'Tous', ponctuels:'Ponctuels', recurrents:'Récurrents'};

  var state = {
    transactions: [],
    categoriesSortie: CATEGORIES_SORTIE_DEFAUT,
    categoriesEntree: CATEGORIES_ENTREE_DEFAUT,
    objectifEpargne: 15,
    soldeInitial: 0,
    periode: 'mois',
    filtreCategorie: 'toutes',
    filtreRecurrence: 'toutes', // 'toutes' | 'ponctuels' | 'recurrents' — isole les mouvements courants noyés parmi les échéances récurrentes générées
    compteAffiche: '', // '' = Courant, sinon id d'un compte d'épargne — quel grand livre Mouvements affiche
    objectifsAutoSync: false, // true = objectifs des postes de dépenses recalculés en direct sur les dépenses réelles (voir objectifEffectif)
    archives: [], // années civiles archivées : [{annee, transactions:[...], soldeNet, dateArchivage}]
    // Comptes d'épargne : chacun fonctionne comme un mini grand livre autonome, alimenté par son
    // propre relevé CSV (pas par duplication des virements du compte principal — voir note à
    // l'import). [{id, nom, couleur, soldeInitial, transactions:[...], dateCreation}]
    comptes: []
  };
  // Séparé de `state` à dessein : ne doit jamais se retrouver dans un export JSON/Excel partagé.
  var identifiantsCloud = { masterKey: '', binId: '' };

  var vueActive = 'dashboard';
  var VUES_AVEC_PERIODE = ['dashboard','repartition','optimisation'];
  var anneeArchiveOuverte = null; // état d'affichage (repliable) du détail d'une archive dans Réglages
  var compteOuvertId = null; // état d'affichage (repliable) du détail d'un compte d'épargne dans Réglages

  // ---------- Utilitaires ----------
  function genId(){ return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }
  function escapeHtml(str){ var div = document.createElement('div'); div.textContent = str==null?'':String(str); return div.innerHTML; }
  // Tri alphabétique (locale FR, insensible accents/casse) sans muter la liste d'origine — utilisé
  // partout où des catégories sont listées pour sélection/gestion (dropdown du modal, Postes de
  // dépenses, Sources de revenus, filtre de Mouvements). Ne s'applique volontairement PAS à
  // repartitionParCategorie/planOptimisation, qui ont leur propre tri par pertinence (montant/écart).
  function triAlpha(liste){
    return liste.slice().sort(function(a,b){ return a.nom.localeCompare(b.nom, 'fr', {sensitivity:'base'}); });
  }
  function parseMontant(str){ if(!str) return NaN; var nettoye = String(str).trim().replace(/\s/g,'').replace(',', '.'); return parseFloat(nettoye); }

  var formateurMontant = new Intl.NumberFormat('fr-FR', {style:'currency', currency:'EUR', minimumFractionDigits:2, maximumFractionDigits:2});
  function formatMontant(n){ return formateurMontant.format(n||0); }
  function formatPct(n){ return (Math.round(n*10)/10).toLocaleString('fr-FR', {minimumFractionDigits:0, maximumFractionDigits:1}) + '%'; }
  function formatDateAffichage(dateStr){ var d = new Date(dateStr+'T00:00:00'); return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'short', year:'numeric'}); }
  // Date du jour au format YYYY-MM-DD en heure LOCALE (contrairement à toISOString() qui est en UTC
  // et peut donc désigner encore « hier » en soirée pour un fuseau en avance sur UTC comme la France).
  function dateLocaleISO(d){
    d = d || new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function libellePeriode(){
    if(state.periode==='mois') return 'ce mois-ci';
    if(state.periode==='mois-dernier') return 'le mois dernier';
    if(state.periode==='annee') return 'cette année';
    return 'toute la période';
  }
  function trierParDateDesc(a,b){
    if(a.date === b.date) return (b.id||'').localeCompare(a.id||'');
    return a.date < b.date ? 1 : -1;
  }
  function getCategorie(id, type){
    var liste = type==='entree' ? state.categoriesEntree : state.categoriesSortie;
    for(var i=0;i<liste.length;i++){ if(liste[i].id===id) return liste[i]; }
    // Une sortie catégorisée avec l'id d'un compte d'épargne est un virement vers ce compte
    // (voir remplirCategories) : elle n'a pas d'entrée dans categoriesSortie, on résout ici.
    if(type==='sortie'){
      var compte = getCompte(id);
      if(compte) return {nom:'Virement vers '+compte.nom, couleur:compte.couleur};
    }
    return {nom:'Catégorie supprimée', couleur:'#8A7F6E'};
  }
  // ---------- Comptes d'épargne ----------
  function getCompte(id){
    for(var i=0;i<state.comptes.length;i++){ if(state.comptes[i].id===id) return state.comptes[i]; }
    return null;
  }
  // Même logique que soldeGlobal (voir plus bas) : les mouvements datés dans le futur n'impactent
  // pas encore le solde affiché.
  function soldeCompte(compte){
    var aujourdhui = dateLocaleISO();
    return (compte.transactions||[]).reduce(function(acc,t){
      if(t.date > aujourdhui) return acc;
      return acc + (t.type==='entree'? t.montant : -t.montant);
    }, compte.soldeInitial||0);
  }

  // ---------- Stockage ----------
  // window.storage n'existe que dans l'aperçu Claude. Une fois le fichier déployé ailleurs
  // (GitHub Pages, etc.), on bascule automatiquement sur localStorage du navigateur.
  function storageClaudeDisponible(){
    return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function';
  }
  function attendre(ms){ return new Promise(function(resolve){ setTimeout(resolve, ms); }); }
  function appelStorage(fn){
    try{
      var resultat = fn();
      return (resultat && typeof resultat.then === 'function') ? resultat : Promise.resolve(resultat);
    }catch(e){
      return Promise.reject(e);
    }
  }
  function avecDelaiMax(promesse, ms){
    return new Promise(function(resolve, reject){
      var regle = false;
      var minuteur = setTimeout(function(){ if(!regle){ regle = true; reject(new Error('Délai de stockage dépassé')); } }, ms);
      promesse.then(
        function(v){ if(!regle){ regle = true; clearTimeout(minuteur); resolve(v); } },
        function(e){ if(!regle){ regle = true; clearTimeout(minuteur); reject(e); } }
      );
    });
  }
  function storageGetAvecRetry(cle, tentative){
    if(!storageClaudeDisponible()){
      try{
        var brut = localStorage.getItem(cle);
        return Promise.resolve(brut===null ? null : {key:cle, value:brut, shared:false});
      }catch(e){ return Promise.reject(e); }
    }
    tentative = tentative || 1;
    return avecDelaiMax(appelStorage(function(){ return window.storage.get(cle, false); }), 1500).catch(function(e){
      if(tentative >= 3) throw e;
      return attendre(300*tentative).then(function(){ return storageGetAvecRetry(cle, tentative+1); });
    });
  }
  function storageSetAvecRetry(cle, valeur, tentative){
    if(!storageClaudeDisponible()){
      try{
        localStorage.setItem(cle, valeur);
        return Promise.resolve({key:cle, value:valeur, shared:false});
      }catch(e){ return Promise.reject(e); }
    }
    tentative = tentative || 1;
    return avecDelaiMax(appelStorage(function(){ return window.storage.set(cle, valeur, false); }), 1500).catch(function(e){
      if(tentative >= 3) throw e;
      return attendre(300*tentative).then(function(){ return storageSetAvecRetry(cle, valeur, tentative+1); });
    });
  }
  function sauvegarder(){
    return storageSetAvecRetry('budget-grandlivre-data', JSON.stringify(state)).catch(function(e){
      console.error('Erreur de sauvegarde', e);
      toast('Sauvegarde indisponible — pensez à exporter vos données.');
    });
  }
  function chargerDonnees(){
    return storageGetAvecRetry('budget-grandlivre-data').then(function(res){
      if(res && res.value){
        var data = JSON.parse(res.value);
        if(Array.isArray(data.transactions)) state.transactions = data.transactions;
        if(Array.isArray(data.categoriesSortie)) state.categoriesSortie = data.categoriesSortie;
        if(Array.isArray(data.categoriesEntree)) state.categoriesEntree = data.categoriesEntree;
        if(typeof data.objectifEpargne === 'number') state.objectifEpargne = data.objectifEpargne;
        if(typeof data.soldeInitial === 'number') state.soldeInitial = data.soldeInitial;
        if(typeof data.periode === 'string') state.periode = data.periode;
        if(typeof data.objectifsAutoSync === 'boolean') state.objectifsAutoSync = data.objectifsAutoSync;
        if(Array.isArray(data.archives)) state.archives = data.archives;
        if(Array.isArray(data.comptes)) state.comptes = data.comptes;
        return false;
      }
      return true;
    }).catch(function(){
      console.log('Aucune donnée existante, initialisation par défaut.');
      return true;
    }).then(function(doitAmorcer){
      if(doitAmorcer){
        var transactionsInitiales = analyserReleveCSV(RELEVE_INITIAL);
        if(transactionsInitiales && transactionsInitiales.length>0){
          state.transactions = transactionsInitiales;
          return sauvegarder();
        }
      }
    });
  }

  // ---------- Calculs ----------
  function getPeriodeRange(){
    var now = new Date();
    if(state.periode === 'mois'){
      return { debut:new Date(now.getFullYear(), now.getMonth(), 1), fin:new Date(now.getFullYear(), now.getMonth()+1, 0, 23,59,59) };
    }
    if(state.periode === 'mois-dernier'){
      return { debut:new Date(now.getFullYear(), now.getMonth()-1, 1), fin:new Date(now.getFullYear(), now.getMonth(), 0, 23,59,59) };
    }
    if(state.periode === 'annee'){
      return { debut:new Date(now.getFullYear(), 0, 1), fin:new Date(now.getFullYear(), 11, 31, 23,59,59) };
    }
    return { debut:new Date(2000,0,1), fin:new Date(2100,0,1) };
  }
  function transactionsPeriode(){
    var r = getPeriodeRange();
    return state.transactions.filter(function(t){ var d = new Date(t.date+'T12:00:00'); return d>=r.debut && d<=r.fin; });
  }
  function soldeGlobal(){
    // Le solde est calculé à date : les mouvements saisis avec une date future (ex. charges
    // récurrentes projetées, virement planifié) ne sont pas encore réalisés et ne doivent
    // donc pas impacter le solde affiché — ils restent visibles dans Mouvements/Répartition et
    // regroupés à part dans l'Item « Échéances à venir » du Dashboard (voir echeancesAVenir).
    var aujourdhui = dateLocaleISO();
    return state.transactions.reduce(function(acc,t){
      if(t.date > aujourdhui) return acc;
      return acc + (t.type==='entree'? t.montant : -t.montant);
    }, state.soldeInitial||0);
  }
  function totauxPeriode(){
    var txs = transactionsPeriode();
    var entrees = txs.filter(function(t){return t.type==='entree';}).reduce(function(a,t){return a+t.montant;},0);
    var sorties = txs.filter(function(t){return t.type==='sortie';}).reduce(function(a,t){return a+t.montant;},0);
    return {entrees:entrees, sorties:sorties};
  }
  // Mouvements datés dans le futur (dont les occurrences de récurrences pas encore atteintes) :
  // n'impactent pas le solde (voir soldeGlobal) tant que leur date n'est pas arrivée. Affichés à
  // part dans un Item dédié du Dashboard (renderBlocEcheances) plutôt que noyés dans le solde.
  function echeancesAVenir(){
    var aujourdhui = dateLocaleISO();
    return state.transactions.filter(function(t){ return t.date > aujourdhui; }).sort(function(a,b){
      if(a.date === b.date) return (a.id||'').localeCompare(b.id||'');
      return a.date < b.date ? -1 : 1;
    });
  }
  // ---------- Objectifs en direct (mode Auto) ----------
  // % réel de dépense par catégorie, calculé sur l'année civile en cours pour rester une référence
  // stable indépendante de l'onglet/période consultés (sinon les objectifs « clignoteraient » en
  // changeant de période) ; repli sur tout l'historique si l'année en cours n'a encore aucune
  // dépense. Étant une répartition de 100% du total dépensé, la somme retombe toujours pile sur
  // 100% (l'arrondi éventuel est absorbé par la plus grosse catégorie, même mécanisme que
  // redistribuerAutresObjectifs).
  function objectifsActuelsParCategorie(){
    var anneeActuelle = new Date().getFullYear();
    var reference = state.transactions.filter(function(t){ return t.type==='sortie' && anneeDe(t)===anneeActuelle; });
    if(reference.length===0) reference = state.transactions.filter(function(t){ return t.type==='sortie'; });
    var totalParCat = {}, total = 0;
    reference.forEach(function(t){ totalParCat[t.categorie] = (totalParCat[t.categorie]||0) + t.montant; total += t.montant; });
    var resultat = {};
    if(total<=0 || state.categoriesSortie.length===0) return resultat;
    state.categoriesSortie.forEach(function(c){ resultat[c.id] = Math.round((totalParCat[c.id]||0) / total * 100); });
    var somme = state.categoriesSortie.reduce(function(a,c){ return a+(resultat[c.id]||0); }, 0);
    var ecart = 100 - somme;
    if(ecart !== 0){
      var plusGrosseId = state.categoriesSortie.reduce(function(a,c){ return (resultat[c.id]||0) > (resultat[a]||0) ? c.id : a; }, state.categoriesSortie[0].id);
      resultat[plusGrosseId] = Math.max(0, (resultat[plusGrosseId]||0) + ecart);
    }
    return resultat;
  }
  // Objectif à afficher/utiliser pour une catégorie : la valeur en direct si le mode Auto est actif
  // (et qu'une dépense existe pour la calculer), sinon la valeur manuelle enregistrée. N'écrase
  // jamais c.objectif en mémoire : basculer en Manuel retrouve exactement les valeurs d'origine.
  function objectifEffectif(c){
    if(state.objectifsAutoSync){
      var actuels = objectifsActuelsParCategorie();
      if(actuels[c.id] !== undefined) return actuels[c.id];
    }
    return c.objectif||0;
  }
  function repartitionParCategorie(){
    var txs = transactionsPeriode().filter(function(t){return t.type==='sortie';});
    var total = txs.reduce(function(a,t){return a+t.montant;},0);
    var map = {};
    txs.forEach(function(t){ map[t.categorie] = (map[t.categorie]||0) + t.montant; });
    // Un virement vers un compte d'épargne est une sortie (categorie = id du compte, voir
    // remplirCategories) : sans entrée correspondante ici, son montant gonflerait `total` sans
    // apparaître dans aucune part, ce qui fausserait tous les pourcentages affichés. On l'ajoute
    // donc comme catégorie à part entière (estCompte:true, objectif fixe à 0 — voir
    // planOptimisation qui l'exclut du plan, un objectif à 0% n'y aurait pas de sens).
    var toutes = state.categoriesSortie.map(function(cat){
      return {id:cat.id, nom:cat.nom, couleur:cat.couleur, objectif:objectifEffectif(cat), estCompte:false};
    }).concat(state.comptes.map(function(c){
      return {id:c.id, nom:'Virement vers '+c.nom, couleur:c.couleur, objectif:0, estCompte:true};
    }));
    return toutes.map(function(cat){
      var montant = map[cat.id] || 0;
      var pct = total>0 ? (montant/total*100) : 0;
      return {id:cat.id, nom:cat.nom, couleur:cat.couleur, objectif:cat.objectif, montant:montant, pct:pct, estCompte:cat.estCompte};
    });
  }
  function planOptimisation(){
    // Les virements vers un compte d'épargne sont exclus du plan d'optimisation : ils sont déjà
    // valorisés globalement par la carte « Taux d'épargne » (montantEpargnePeriode les compte),
    // et une carte individuelle avec un objectif à 0% n'aurait pas de sens ici.
    return repartitionParCategorie().filter(function(c){ return !c.estCompte; }).map(function(c){
      return {id:c.id, nom:c.nom, couleur:c.couleur, objectif:c.objectif, montant:c.montant, pct:c.pct, ecart:c.pct - c.objectif};
    }).sort(function(a,b){ return b.ecart - a.ecart; });
  }
  // Les sorties catégorisées « Épargne » sont de l'argent mis de côté, pas dépensé : on les retire
  // des sorties prises en compte pour le taux d'épargne réel, sinon un virement vers l'épargne fait
  // mécaniquement baisser ce taux alors qu'il traduit l'inverse (cf. incohérence -8,9% vs carte
  // Épargne à 47% du plan d'optimisation, qui elle raisonne déjà correctement par catégorie).
  // Même raisonnement pour un virement vers un compte d'épargne (catégorie = id du compte, voir
  // remplirCategories) : c'est aussi de l'épargne, pas une dépense.
  function montantEpargnePeriode(){
    return transactionsPeriode().filter(function(t){ return t.type==='sortie' && (t.categorie==='epargne' || getCompte(t.categorie)!==null); })
      .reduce(function(a,t){ return a+t.montant; }, 0);
  }
  function epargneNettePeriode(){
    var t = totauxPeriode();
    return (t.entrees - t.sorties) + montantEpargnePeriode();
  }
  function tauxEpargneReel(){
    var t = totauxPeriode();
    if(t.entrees<=0) return 0;
    return epargneNettePeriode() / t.entrees * 100;
  }

  // ---------- Mouvements récurrents ----------
  // Génère, à partir d'un mouvement de base et d'une fréquence, les occurrences futures :
  // - hebdomadaire/mensuel/trimestriel/semestriel : jusqu'à décembre inclus de l'année civile de la
  //   date saisie (même jour du mois pour les fréquences mensuelles, ramené au dernier jour si le
  //   mois est plus court). C'est le mécanisme mensuel déjà validé, généralisé à un pas variable.
  // - annuel : CORRIGÉ — borné à l'année civile EN COURS comme les autres fréquences, au lieu de
  //   systématiquement projeter date+1 an. L'ancien comportement générait, dès la saisie d'une charge
  //   annuelle en 2026, une occurrence datée 2027 (visible immédiatement dans Mouvements et dans les
  //   totaux « Tout » du Dashboard, alors qu'on n'était même pas encore en 2027). Si la date de base
  //   est ancienne (conversion d'un mouvement passé en récurrent), on rattrape toutes les échéances
  //   annuelles dues jusqu'à l'année en cours incluse — même logique de rattrapage que
  //   synchroniserRecurrences, ici appliquée dès la création/conversion plutôt qu'au démarrage suivant.
  // Ces occurrences futures s'intègrent naturellement à Répartition/Optimisation (période « Cette
  // année » ou « Tout ») mais n'impactent pas le solde tant que leur date n'est pas atteinte.
  function fabriquerOccurrence(base, dateOccurrence){
    return {
      id: genId(), type: base.type, montant: base.montant, categorie: base.categorie,
      description: base.description, date: dateOccurrence,
      recurrent: true, recurrenceId: base.recurrenceId, recurrenceFrequence: base.recurrenceFrequence
    };
  }
  function genererOccurrencesRecurrentes(base, frequence){
    var d0 = new Date(base.date+'T00:00:00');
    var occurrences = [];

    if(frequence === 'hebdomadaire'){
      var an0 = d0.getFullYear();
      for(var k=1; ; k++){
        var d = new Date(an0, d0.getMonth(), d0.getDate() + 7*k);
        if(d.getFullYear() !== an0) break; // sorti de l'année civile de départ
        occurrences.push(fabriquerOccurrence(base, dateLocaleISO(d)));
      }
      return occurrences;
    }

    if(frequence === 'annuel'){
      var anneeActuelleAnnuel = new Date().getFullYear();
      var curseurAnnuel = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate());
      while(curseurAnnuel.getFullYear() < anneeActuelleAnnuel){
        curseurAnnuel = new Date(curseurAnnuel.getFullYear()+1, curseurAnnuel.getMonth(), curseurAnnuel.getDate());
        occurrences.push(fabriquerOccurrence(base, dateLocaleISO(curseurAnnuel)));
      }
      return occurrences;
    }

    // mensuel (pas=1, comportement d'origine inchangé) / trimestriel (pas=3) / semestriel (pas=6)
    var pasMois = frequence==='trimestriel' ? 3 : (frequence==='semestriel' ? 6 : 1);
    var jourCible = d0.getDate();
    var anneeCible = d0.getFullYear();
    for(var mois = d0.getMonth()+pasMois; mois <= 11; mois += pasMois){
      var dernierJourMois = new Date(anneeCible, mois+1, 0).getDate();
      var jour = Math.min(jourCible, dernierJourMois);
      var dateOccurrence = anneeCible + '-' + String(mois+1).padStart(2,'0') + '-' + String(jour).padStart(2,'0');
      occurrences.push(fabriquerOccurrence(base, dateOccurrence));
    }
    return occurrences;
  }

  // ---------- Rattrapage des séries récurrentes ----------
  // genererOccurrencesRecurrentes ne génère les occurrences que jusqu'à décembre de l'ANNÉE DE LA
  // TRANSACTION DE BASE (voir plus haut) : une charge mensuelle créée en 2025 n'a donc jamais eu
  // ses échéances 2026 générées si l'app n'a pas été rouverte entretemps pour les régénérer — ces
  // sorties manquantes ne sont jamais déduites du solde, qui apparaît alors trop élevé. Cette
  // fonction, appelée à chaque démarrage, détecte les séries dont la dernière occurrence connue est
  // antérieure à l'année en cours et complète le manquant jusqu'à décembre de l'année en cours
  // inclus, en respectant le pas de la fréquence (peut rattraper plusieurs années d'un coup si
  // l'app est restée fermée longtemps). Idempotent : une série déjà à jour n'est jamais retouchée,
  // donc un appel à chaque démarrage ne duplique rien.
  function synchroniserRecurrences(){
    var anneeActuelle = new Date().getFullYear();
    var series = {};
    state.transactions.forEach(function(t){
      if(!t.recurrenceId) return;
      (series[t.recurrenceId] = series[t.recurrenceId] || []).push(t);
    });
    var ajouts = [];
    Object.keys(series).forEach(function(rid){
      var occs = series[rid];
      var derniere = occs.reduce(function(a,b){ return a.date > b.date ? a : b; });
      if(anneeDe(derniere) >= anneeActuelle) return; // déjà à jour
      var freq = derniere.recurrenceFrequence;
      var base = {
        type: derniere.type, montant: derniere.montant, categorie: derniere.categorie,
        description: derniere.description, recurrenceId: rid, recurrenceFrequence: freq
      };
      if(freq === 'hebdomadaire'){
        var curseurH = new Date(derniere.date+'T00:00:00');
        curseurH = new Date(curseurH.getFullYear(), curseurH.getMonth(), curseurH.getDate()+7);
        while(curseurH.getFullYear() <= anneeActuelle){
          ajouts.push(fabriquerOccurrence(base, dateLocaleISO(curseurH)));
          curseurH = new Date(curseurH.getFullYear(), curseurH.getMonth(), curseurH.getDate()+7);
        }
        return;
      }
      if(freq === 'annuel'){
        var curseurA = new Date(derniere.date+'T00:00:00');
        while(curseurA.getFullYear() < anneeActuelle){
          curseurA = new Date(curseurA.getFullYear()+1, curseurA.getMonth(), curseurA.getDate());
          ajouts.push(fabriquerOccurrence(base, dateLocaleISO(curseurA)));
        }
        return;
      }
      // mensuel (pas=1) / trimestriel (pas=3) / semestriel (pas=6) : reprend le cycle exactement là
      // où la dernière occurrence connue s'est arrêtée, jusqu'à décembre de l'année en cours inclus.
      var pas = freq==='trimestriel' ? 3 : (freq==='semestriel' ? 6 : 1);
      var dRef = new Date(derniere.date+'T00:00:00');
      var jourCible = dRef.getDate();
      var curseurAnnee = dRef.getFullYear();
      var curseurMois = dRef.getMonth() + pas;
      while(curseurAnnee < anneeActuelle || (curseurAnnee===anneeActuelle && curseurMois<=11)){
        if(curseurMois > 11){ curseurMois -= 12; curseurAnnee += 1; continue; }
        var dernierJourMois = new Date(curseurAnnee, curseurMois+1, 0).getDate();
        var jour = Math.min(jourCible, dernierJourMois);
        var dateOcc = curseurAnnee + '-' + String(curseurMois+1).padStart(2,'0') + '-' + String(jour).padStart(2,'0');
        ajouts.push(fabriquerOccurrence(base, dateOcc));
        curseurMois += pas;
      }
    });
    if(ajouts.length>0) state.transactions = state.transactions.concat(ajouts);
    return ajouts.length;
  }

  // ---------- Correctif : occurrences générées trop tôt ----------
  // Avant correction, une charge/recette « annuelle » projetait systématiquement une occurrence à
  // date+1 an dès sa création ou sa conversion (voir genererOccurrencesRecurrentes), ce qui a pu
  // laisser des mouvements datés au-delà de l'année en cours (ex. 2027 alors qu'on est en 2026) dans
  // des données déjà enregistrées. Cette fonction, appelée une fois à chaque démarrage, retire toute
  // occurrence dérivée (recurrent, id différent de recurrenceId) dont l'année dépasse l'année civile
  // en cours — elle sera régénérée au bon moment par synchroniserRecurrences le moment venu. Ne touche
  // jamais le mouvement de base d'une série (id === recurrenceId), ni un mouvement non récurrent.
  // Idempotent : une fois les données assainies, ne retrouve plus rien à retirer.
  function purgerOccurrencesHorsAnnee(){
    var anneeActuelle = new Date().getFullYear();
    var avant = state.transactions.length;
    state.transactions = state.transactions.filter(function(t){
      var estOccurrenceDerivee = !!t.recurrenceId && t.id !== t.recurrenceId;
      return !(estOccurrenceDerivee && anneeDe(t) > anneeActuelle);
    });
    return avant - state.transactions.length;
  }

  // ---------- Archivage annuel ----------
  function anneeDe(t){ return parseInt(t.date.slice(0,4), 10); }
  function anneesDisponiblesPourArchivage(){
    var anneeActuelle = new Date().getFullYear();
    var dejaArchivees = state.archives.map(function(a){ return a.annee; });
    var presentes = {};
    state.transactions.forEach(function(t){
      var a = anneeDe(t);
      if(a < anneeActuelle && dejaArchivees.indexOf(a)===-1) presentes[a] = true;
    });
    return Object.keys(presentes).map(Number).sort(function(a,b){return a-b;});
  }
  function archiverAnnee(annee){
    var aArchiver = state.transactions.filter(function(t){ return anneeDe(t)===annee; });
    if(aArchiver.length===0) return;
    var soldeNet = aArchiver.reduce(function(acc,t){ return acc + (t.type==='entree'? t.montant : -t.montant); }, 0);
    state.transactions = state.transactions.filter(function(t){ return anneeDe(t)!==annee; });
    // Le solde initial absorbe l'effet net de l'année archivée : le solde global reste exact
    // sans avoir besoin de recharger les transactions archivées à chaque calcul.
    state.soldeInitial = (state.soldeInitial||0) + soldeNet;
    state.archives.push({annee:annee, transactions:aArchiver, soldeNet:soldeNet, dateArchivage:dateLocaleISO()});
    state.archives.sort(function(a,b){ return a.annee - b.annee; });
  }
  function desarchiverAnnee(annee){
    var idx = -1;
    for(var i=0;i<state.archives.length;i++){ if(state.archives[i].annee===annee){ idx=i; break; } }
    if(idx===-1) return;
    var archive = state.archives[idx];
    state.transactions = state.transactions.concat(archive.transactions);
    state.soldeInitial = (state.soldeInitial||0) - archive.soldeNet;
    state.archives.splice(idx,1);
  }

  // ---------- Graphique donut SVG ----------
  function genererDonut(data){
    var size = 196, strokeWidth = 26;
    var total = data.reduce(function(a,c){return a+c.montant;},0);
    var rayon = (size - strokeWidth)/2;
    var circonference = 2*Math.PI*rayon;
    var offsetCumule = 0;
    var svg = '<svg viewBox="0 0 '+size+' '+size+'">';
    svg += '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+rayon+'" fill="none" stroke="rgba(30,75,58,0.1)" stroke-width="'+strokeWidth+'"/>';
    if(total>0){
      data.forEach(function(c){
        if(c.montant<=0) return;
        var frac = c.montant/total;
        var dash = frac*circonference;
        var gap = circonference-dash;
        svg += '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+rayon+'" fill="none" stroke="'+c.couleur+'" stroke-width="'+strokeWidth+'" stroke-dasharray="'+dash+' '+gap+'" stroke-dashoffset="'+(-offsetCumule)+'" transform="rotate(-90 '+(size/2)+' '+(size/2)+')"/>';
        offsetCumule += dash;
      });
    }
    svg += '</svg>';
    return svg;
  }

  // ---------- Navigation ----------
  function changerVue(nom){
    vueActive = nom;
    document.querySelectorAll('.vue').forEach(function(v){ v.classList.remove('vue--active'); });
    document.getElementById('vue-'+nom).classList.add('vue--active');
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('actif', b.dataset.vue===nom); });
    document.getElementById('barre-periode').style.display = VUES_AVEC_PERIODE.indexOf(nom)!==-1 ? 'flex' : 'none';
    document.getElementById('fab-ajouter').style.display = (nom==='reglages') ? 'none' : 'flex';
    renderVueActive();
    document.querySelector('.contenu').scrollTop = 0;
  }
  function renderVueActive(){
    if(vueActive==='dashboard') renderDashboard();
    else if(vueActive==='mouvements') renderMouvements();
    else if(vueActive==='repartition') renderRepartition();
    else if(vueActive==='optimisation') renderOptimisation();
    else if(vueActive==='reglages') renderReglages();
  }
  function render(){ renderVueActive(); }

  // ---------- Rendu : liste de mouvements (partagé) ----------
  function renderListeMouvements(txs, masquerAVenir, videTitre, videSous){
    if(txs.length===0){
      var titreVide = videTitre || 'Le grand livre est vierge.';
      var sousVide = (videSous!==undefined) ? videSous : 'Notez votre première entrée ou sortie pour commencer.';
      return '<div class="etat-vide"><p>'+titreVide+'</p>'+(sousVide ? '<p class="etat-vide-sous">'+sousVide+'</p>' : '')+'</div>';
    }
    var aujourdhui = dateLocaleISO();
    return '<div class="liste-mvts">' + txs.map(function(t){
      var cat = getCategorie(t.categorie, t.type);
      var signe = t.type==='entree' ? '+' : '-';
      var classe = t.type==='entree' ? 'ink-credit' : 'ink-debit';
      var marques = '';
      if(!masquerAVenir && t.date > aujourdhui) marques += ' · <span class="marque-avenir">à venir</span>';
      if(t.recurrent) marques += ' <span class="marque-recurrent" title="Mouvement récurrent">↻'+(LIBELLES_FREQUENCE[t.recurrenceFrequence] ? ' '+LIBELLES_FREQUENCE[t.recurrenceFrequence] : '')+'</span>';
      return '<button class="ligne-mvt" data-id="'+t.id+'" type="button">' +
        '<span class="ligne-mvt-tick" style="background:'+cat.couleur+'"></span>' +
        '<span class="ligne-mvt-corps">' +
          '<span class="ligne-mvt-titre">'+escapeHtml(t.description || cat.nom)+'</span>' +
          '<span class="ligne-mvt-sous">'+escapeHtml(cat.nom)+' · '+formatDateAffichage(t.date)+marques+'</span>' +
        '</span>' +
        '<span class="ligne-mvt-montant '+classe+'">'+signe+formatMontant(t.montant)+'</span>' +
      '</button>';
    }).join('') + '</div>';
  }
  function attacherClicsLignes(container){
    container.querySelectorAll('.ligne-mvt').forEach(function(btn){
      btn.addEventListener('click', function(){ ouvrirModal(btn.dataset.id); });
    });
  }

  // ---------- Rendu : Échéances à venir (Item dédié, distinct du solde) ----------
  function renderBlocEcheances(echeances){
    if(echeances.length===0) return '';
    var net = echeances.reduce(function(a,t){ return a + (t.type==='entree'? t.montant : -t.montant); }, 0);
    var signe = net>=0 ? '+' : '';
    var visibles = echeances.slice(0,5);
    var reste = echeances.length - visibles.length;
    return '<div class="section-titre-ligne"><h2 class="section-titre">Échéances à venir</h2></div>' +
      '<p class="aide-texte">'+echeances.length+' échéance'+(echeances.length>1?'s':'')+' programmée'+(echeances.length>1?'s':'')+
        ' · impact net '+signe+formatMontant(net)+' — n\'impactent pas le solde avant leur date</p>' +
      renderListeMouvements(visibles, true) +
      (reste>0 ? '<p class="aide-texte" style="text-align:center;margin-top:-4px">+ '+reste+' autre'+(reste>1?'s':'')+'</p>' : '');
  }

  // ---------- Rendu : Comptes d'épargne (résumé Dashboard) ----------
  function renderBlocComptesDashboard(){
    if(state.comptes.length===0) return '';
    return '<div class="section-titre-ligne"><h2 class="section-titre">Comptes d\'épargne</h2><button class="lien-voir-tout" type="button" data-nav="reglages">Gérer</button></div>' +
      '<div class="grille-stats" style="margin-bottom:20px">' + state.comptes.map(function(c){
        var solde = soldeCompte(c);
        var positif = solde>=0;
        return '<div class="carte-stat"><p class="carte-stat-label">'+escapeHtml(c.nom)+'</p><p class="carte-stat-valeur '+(positif?'ink-credit':'ink-debit')+'">'+formatMontant(solde)+'</p></div>';
      }).join('') + '</div>';
  }

  // ---------- Rendu : Dashboard ----------
  function renderDashboard(){
    var solde = soldeGlobal();
    var t = totauxPeriode();
    var el = document.getElementById('vue-dashboard');
    var soldePositif = solde >= 0;
    // Les échéances futures déjà générées (ex. la prochaine occurrence d'une série annuelle) n'ont
    // pas leur place dans une liste de mouvements RÉCENTS — elles ont leur propre section « Échéances
    // à venir » juste au-dessus. Sans ce filtre, une occurrence lointaine remontait en tête (tri par
    // date décroissante) et masquait l'activité réellement récente.
    var aujourdhuiRecents = dateLocaleISO();
    var recents = state.transactions.filter(function(t){ return t.date <= aujourdhuiRecents; }).sort(trierParDateDesc).slice(0,5);
    var echeances = echeancesAVenir();
    el.innerHTML =
      '<div class="hero-solde">' +
        '<p class="eyebrow">Solde du grand livre</p>' +
        '<p class="hero-chiffre '+(soldePositif?'ink-credit':'ink-debit')+'">'+formatMontant(solde)+'</p>' +
        '<p class="hero-solde-date">au '+formatDateAffichage(dateLocaleISO())+'</p>' +
        '<div class="double-regle"></div>' +
      '</div>' +
      '<div class="grille-stats">' +
        '<div class="carte-stat"><p class="carte-stat-label">Entrées · '+libellePeriode()+'</p><p class="carte-stat-valeur ink-credit">+'+formatMontant(t.entrees)+'</p></div>' +
        '<div class="carte-stat"><p class="carte-stat-label">Sorties · '+libellePeriode()+'</p><p class="carte-stat-valeur ink-debit">-'+formatMontant(t.sorties)+'</p></div>' +
      '</div>' +
      renderBlocComptesDashboard() +
      renderBlocEcheances(echeances) +
      '<div class="section-titre-ligne"><h2 class="section-titre">Derniers mouvements</h2><button class="lien-voir-tout" type="button" data-nav="mouvements">Tout voir</button></div>' +
      renderListeMouvements(recents);

    if(lien) lien.addEventListener('click', function(){ changerVue('mouvements'); });
    var lienComptes = el.querySelector('[data-nav="reglages"]');
    if(lienComptes) lienComptes.addEventListener('click', function(){ changerVue('reglages'); });
    attacherClicsLignes(el);
  }

  // ---------- Rendu : Mouvements ----------
  function renderMouvements(){
    var el = document.getElementById('vue-mouvements');
    var compteAffiche = state.compteAffiche || '';
    if(compteAffiche && !getCompte(compteAffiche)) compteAffiche = state.compteAffiche = ''; // compte supprimé entretemps
    var selectCompteHtml = '<select id="select-compte-mouvements" class="select-filtre">' +
      '<option value="">Courant</option>' +
      triAlpha(state.comptes).map(function(c){ return '<option value="'+c.id+'" '+(c.id===compteAffiche?'selected':'')+'>'+escapeHtml(c.nom)+'</option>'; }).join('') +
    '</select>';

    if(compteAffiche){
      var compte = getCompte(compteAffiche);
      var txsCompte = (compte.transactions||[]).slice().sort(trierParDateDesc);
      el.innerHTML =
        '<h2 class="section-titre">Mouvements</h2>' +
        '<div class="filtres-mouvements">' + selectCompteHtml + '</div>' +
        '<p class="aide-texte">Solde actuel : '+formatMontant(soldeCompte(compte))+'</p>' +
        renderListeMouvements(txsCompte, false, 'Ce compte est vierge.', 'Ajoutez un mouvement ou importez un relevé pour commencer.');
      document.getElementById('select-compte-mouvements').addEventListener('change', function(e){
        state.compteAffiche = e.target.value;
        renderMouvements();
      });
      attacherClicsLignes(el);
      return;
    }

    var filtreCat = state.filtreCategorie || 'toutes';
    var filtreRec = state.filtreRecurrence || 'toutes';
    var txs = state.transactions.slice().sort(trierParDateDesc);
    if(filtreCat !== 'toutes'){ txs = txs.filter(function(t){ return t.categorie===filtreCat; }); }
    if(filtreRec === 'ponctuels'){ txs = txs.filter(function(t){ return !t.recurrent; }); }
    else if(filtreRec === 'recurrents'){
      // Le rattrapage des récurrences (synchroniserRecurrences) peut désormais régénérer plusieurs
      // mois, voire plusieurs années, d'un coup pour une série longtemps restée sans ouverture de
      // l'appli — sans ce filtre, « Récurrents » deviendrait une liste énorme couvrant toute l'année
      // (voire plusieurs). On la restreint donc au mois en cours, la portée la plus utile pour
      // vérifier « quelles charges récurrentes tombent ce mois-ci ».
      var moisCourant = dateLocaleISO().slice(0,7);
      txs = txs.filter(function(t){ return !!t.recurrent && t.date.slice(0,7)===moisCourant; });
    }
    var toutesCats = triAlpha(state.categoriesSortie.concat(state.categoriesEntree).concat(
      state.comptes.map(function(c){ return {id:c.id, nom:'Virement vers '+c.nom}; })
    ));
    var filtreActif = (filtreCat !== 'toutes') || (filtreRec !== 'toutes');
    var resumeHtml = '';
    if(txs.length>0){
      var net = txs.reduce(function(a,t){ return a + (t.type==='entree'? t.montant : -t.montant); }, 0);
      var signeNet = net>=0 ? '+' : '';
      resumeHtml = '<p class="aide-texte">'+txs.length+' mouvement'+(txs.length>1?'s':'')+' affiché'+(txs.length>1?'s':'')+' · impact net '+signeNet+formatMontant(net)+'</p>';
    }
    el.innerHTML =
      '<h2 class="section-titre">Mouvements</h2>' +
      '<div class="filtres-mouvements">' +
        selectCompteHtml +
        '<select id="select-filtre-cat" class="select-filtre">' +
          '<option value="toutes">Toutes les catégories</option>' +
          toutesCats.map(function(c){ return '<option value="'+c.id+'" '+(c.id===filtreCat?'selected':'')+'>'+escapeHtml(c.nom)+'</option>'; }).join('') +

  function renderOptimisation(){
    var el = document.getElementById('vue-optimisation');
    var t = totauxPeriode();
    var tauxReel = tauxEpargneReel();
    var objectifEp = state.objectifEpargne;
    var atteint = tauxReel >= objectifEp;
    var manqueEp = Math.max(0, (objectifEp/100*t.entrees) - epargneNettePeriode());
    var plan = planOptimisation();

    var html = '<h2 class="section-titre">Plan d\'optimisation</h2>';
    html += '<div class="carte-epargne '+(atteint?'':'carte-epargne--attention')+'">' +
      '<p class="carte-stat-label">Taux d\'épargne · '+libellePeriode()+'</p>' +
      '<p class="carte-epargne-valeur">'+formatPct(tauxReel)+' <span class="carte-epargne-objectif">objectif '+objectifEp+'%</span></p>' +
      '<p class="carte-epargne-message">' + (
        t.entrees<=0 ? "Ajoutez des entrées pour calculer votre taux d'épargne." :
        atteint ? 'Objectif atteint sur cette période.' :
        ('Il manque '+formatMontant(manqueEp)+' pour atteindre l\'objectif.')
      ) + '</p>' +
    '</div>';

    if(t.sorties<=0){
      html += '<div class="etat-vide"><p>Ajoutez des sorties pour voir votre plan d\'optimisation.</p></div>';
    } else {
      html += '<div class="liste-optimisation">' + plan.map(function(c){
        var estEpargne = c.id === 'epargne';
        var horsObjectif = estEpargne ? (c.ecart < -0.5) : (c.ecart > 0.5);
        var montantCible = c.objectif/100*t.sorties;
        var ecartMontant = estEpargne ? Math.max(0, montantCible - c.montant) : Math.max(0, c.montant - montantCible);
        var echelleMax = Math.max(c.objectif*1.5, c.pct, 5);
        var largeurReel = Math.min(100, (c.pct/echelleMax)*100);
        var positionObjectif = Math.min(100, (c.objectif/echelleMax)*100);
        var message;
        if(estEpargne){
          message = horsObjectif ? ('Sous l\'objectif — augmentez d\'environ '+formatMontant(ecartMontant)+' pour l\'atteindre.') : 'Objectif d\'épargne atteint ou dépassé, bravo.';
        } else {
          message = horsObjectif ? ('Dépasse l\'objectif — réduire d\'environ '+formatMontant(ecartMontant)+' pour revenir à '+c.objectif+'%.') : 'Dans l\'objectif.';
        }
        return '<div class="carte-optim '+(horsObjectif?'carte-optim--depasse':'carte-optim--ok')+'">' +
          '<div class="carte-optim-entete">' +
            '<span class="ligne-mvt-tick" style="background:'+c.couleur+'"></span>' +
            '<span class="carte-optim-nom">'+escapeHtml(c.nom)+'</span>' +
            '<span class="carte-optim-pct">'+formatPct(c.pct)+' <span class="carte-optim-objectif">/ '+c.objectif+'%</span></span>' +
          '</div>' +
          '<div class="barre-progression">' +
            '<div class="barre-progression-remplissage" style="width:'+largeurReel+'%; background:'+(horsObjectif?'var(--red-debit)':c.couleur)+'"></div>' +
            '<div class="barre-progression-marqueur" style="left:'+positionObjectif+'%"></div>' +
          '</div>' +
          '<p class="carte-optim-message">' + message + '</p>' +
        '</div>';
      }).join('') + '</div>';
    }
    html += '<p class="note-optimisation">Objectifs indicatifs, modifiables dans Réglages — à ajuster selon votre situation.</p>';
    el.innerHTML = html;
  }

  function attacherLignesCategories(container, type){
    var id = type==='sortie' ? 'liste-cat-sortie' : 'liste-cat-entree';
    var liste = container.querySelector('#'+id);
    if(!liste) return;
    liste.querySelectorAll('.ligne-categorie').forEach(function(ligne){
      var catId = ligne.dataset.id;
      ligne.querySelectorAll('input').forEach(function(input){
        input.addEventListener('change', function(){
          var cats = type==='sortie' ? state.categoriesSortie : state.categoriesEntree;
          var cat = null;
          for(var i=0;i<cats.length;i++){ if(cats[i].id===catId){ cat = cats[i]; break; } }
          if(!cat) return;
          var champ = input.dataset.champ;
          if(champ==='nom') cat.nom = input.value.trim() || cat.nom;
          if(champ==='objectif'){
            var nouvelleValeur = Math.max(0, Math.min(100, parseFloat(input.value)||0));
            cat.objectif = nouvelleValeur;
            // Une modification manuelle qui ferait dépasser 100% au total rééquilibre les AUTRES
            // catégories proportionnellement, comme à l'ajout d'une catégorie (cf.
            // reequilibrerObjectifsApresAjout) — la somme retombe pile sur 100%.
            if(type==='sortie'){
              var autres = cats.filter(function(c){ return c.id!==catId; });
              var sommeAutres = autres.reduce(function(a,c){ return a+(c.objectif||0); }, 0);
              if(autres.length>0 && nouvelleValeur + sommeAutres > 100){
                redistribuerAutresObjectifs(autres, nouvelleValeur);
                sauvegarder();
                renderReglages();
                toast('Objectif mis à jour — autres postes réajustés à 100%');
                return;
              }
            }
          }
          sauvegarder();
        });
      });
      var btnSup = ligne.querySelector('.bouton-supprimer-cat');
      if(btnSup) btnSup.addEventListener('click', function(){ supprimerCategorie(catId, type); });
    });
  }
  // Redistribue proportionnellement les objectifs d'un ensemble de catégories « autres » pour
  // qu'elles occupent l'espace restant (100 - valeurCible), en conservant leur poids relatif entre
  // elles. La plus grosse catégorie absorbe l'écart d'arrondi pour retomber pile sur la cible.
  // Partagée par : l'ajout d'une catégorie, la modification manuelle d'un objectif qui ferait
  // dépasser 100% au total, et le bouton « Rééquilibrer à 100% » (valeurCible=0, autres=toutes).
  function redistribuerAutresObjectifs(autres, valeurCible){
    if(autres.length === 0) return;
    var sommeActuelle = autres.reduce(function(a,c){ return a+(c.objectif||0); }, 0);
    if(sommeActuelle <= 0) return; // rien à répartir proportionnellement
    var espaceRestant = Math.max(0, 100 - valeurCible);
    var facteur = espaceRestant / sommeActuelle;
    var sommeArrondie = 0;
    autres.forEach(function(c){
      c.objectif = Math.round((c.objectif||0) * facteur);
      sommeArrondie += c.objectif;
    });
    var ecart = espaceRestant - sommeArrondie;
    if(ecart !== 0){
      var plusGrosse = autres.reduce(function(a,b){ return (b.objectif>a.objectif)?b:a; }, autres[0]);
      plusGrosse.objectif = Math.max(0, plusGrosse.objectif + ecart);
    }
  }
  // Quand une catégorie de dépense est ajoutée, les objectifs des catégories EXISTANTES sont
  // rééquilibrés proportionnellement pour laisser la place à la nouvelle tout en conservant leur
  // poids relatif, de sorte que la somme totale (existantes + nouvelle) retombe pile sur 100%.
  function reequilibrerObjectifsApresAjout(existantes, nouvelle){
    if(existantes.length === 0){ nouvelle.objectif = 100; return; }
    redistribuerAutresObjectifs(existantes, nouvelle.objectif);
  }
  function ajouterCategorie(type){
    var nom = prompt(type==='sortie' ? 'Nom du nouveau poste de dépense :' : 'Nom de la nouvelle source de revenu :');
    if(!nom || !nom.trim()) return;
    var cats = type==='sortie' ? state.categoriesSortie : state.categoriesEntree;
    var couleur = PALETTE_CATEGORIES[cats.length % PALETTE_CATEGORIES.length];
    var nouvelle = {id: genId(), nom: nom.trim(), couleur: couleur};
    if(type==='sortie'){
      nouvelle.objectif = 5;
      reequilibrerObjectifsApresAjout(cats, nouvelle);
    }
    cats.push(nouvelle);
    sauvegarder();
    renderReglages();
    toast(type==='sortie' ? 'Catégorie ajoutée — objectifs réajustés à 100%' : 'Catégorie ajoutée');
  }
