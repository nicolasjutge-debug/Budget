  // ---------- Export / Import / Reset ----------
  function exporterJSON(){
    var donnees = JSON.stringify(state, null, 2);
    var blob = new Blob([donnees], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var horodatage = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = 'grand-livre-'+horodatage+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Export terminé');
  }
  function importerJSON(e){
    var fichier = e.target.files[0];
    if(!fichier) return;
    var lecteur = new FileReader();
    lecteur.onload = function(evt){
      try{
        var data = JSON.parse(evt.target.result);
        if(!confirm('Remplacer toutes les données actuelles par ce fichier ?')) return;
        if(Array.isArray(data.transactions)) state.transactions = data.transactions;
        if(Array.isArray(data.categoriesSortie)) state.categoriesSortie = data.categoriesSortie;
        if(Array.isArray(data.categoriesEntree)) state.categoriesEntree = data.categoriesEntree;
        if(typeof data.objectifEpargne==='number') state.objectifEpargne = data.objectifEpargne;
        if(typeof data.soldeInitial==='number') state.soldeInitial = data.soldeInitial;
        state.objectifsAutoSync = typeof data.objectifsAutoSync==='boolean' ? data.objectifsAutoSync : false;
        state.archives = Array.isArray(data.archives) ? data.archives : [];
        state.comptes = Array.isArray(data.comptes) ? data.comptes : [];
        sauvegarder();
        render();
        toast('Import réussi');
      }catch(err){
        toast('Fichier invalide');
      }
    };
    lecteur.readAsText(fichier);
    e.target.value = '';
  }
  function effacerToutesLesDonnees(){
    if(!confirm('Effacer définitivement toutes les transactions ? Cette action est irréversible.')) return;
    state.transactions = [];
    state.archives = [];
    state.comptes = [];
    sauvegarder();
    render();
    toast('Données effacées');
  }

  // ---------- Export / Import Excel (SheetJS) ----------
  function trouverIdCategorieParNom(nom, type){
    var liste = type==='entree' ? state.categoriesEntree : state.categoriesSortie;
    var nomNorm = String(nom||'').toLowerCase().trim();
    var trouve = liste.find(function(c){ return c.nom.toLowerCase() === nomNorm; });
    return trouve ? trouve.id : null;
  }
  function exporterExcel(){
    if(typeof XLSX === 'undefined'){ toast('Bibliothèque Excel indisponible (hors ligne ?)'); return; }
    var lignes = state.transactions.slice().sort(trierParDateDesc).map(function(t){
      var cat = getCategorie(t.categorie, t.type);
      return {
        'Date': t.date,
        'Type': t.type==='entree' ? 'Entrée' : 'Sortie',
        'Catégorie': cat.nom,
        'Description': t.description || '',
        'Montant': t.montant
      };
    });
    var feuille = XLSX.utils.json_to_sheet(lignes);
    feuille['!cols'] = [{wch:12},{wch:8},{wch:16},{wch:38},{wch:10}];
    var classeur = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(classeur, feuille, 'Mouvements');
    var horodatage = new Date().toISOString().slice(0,10);
    XLSX.writeFile(classeur, 'grand-livre-'+horodatage+'.xlsx');
    toast('Export Excel terminé');
  }
  function importerExcel(e){
    var fichier = e.target.files[0];
    if(!fichier) return;
    if(typeof XLSX === 'undefined'){ toast('Bibliothèque Excel indisponible (hors ligne ?)'); return; }
    var lecteur = new FileReader();
    lecteur.onload = function(evt){
      try{
        var classeur = XLSX.read(evt.target.result, {type:'array', cellDates:true});
        var feuille = classeur.Sheets[classeur.SheetNames[0]];
        var lignes = XLSX.utils.sheet_to_json(feuille, {defval:''});
        if(lignes.length === 0){ toast('Feuille Excel vide'); return; }

        var cles = Object.keys(lignes[0]);
        function trouverCle(motifs){
          return cles.find(function(k){ var kl=k.toLowerCase(); return motifs.some(function(m){return kl.indexOf(m)!==-1;}); });
        }
        var cleDate = trouverCle(['date']);
        var cleType = trouverCle(['type']);
        var cleCategorie = trouverCle(['categ','catégor']);
        var cleDescription = trouverCle(['description','libell']);
        var cleMontant = trouverCle(['montant']);
        var cleDebit = trouverCle(['debit','débit']);
        var cleCredit = trouverCle(['credit','crédit']);

        if(!cleDate || (!cleMontant && !cleDebit && !cleCredit)){
          toast('Colonnes non reconnues dans ce fichier');
          return;
        }
        function formaterDate(v){
          if(v instanceof Date && !isNaN(v.getTime())) return v.toISOString().slice(0,10);
          if(typeof v === 'string'){
            var iso = convertirDateReleve(v);
            if(iso) return iso;
            var d = new Date(v);
            if(!isNaN(d.getTime())) return d.toISOString().slice(0,10);
          }
          return null;
        }

        var resultat = [];
        lignes.forEach(function(ligne){
          var date = formaterDate(ligne[cleDate]);
          if(!date) return;
          var description = cleDescription ? String(ligne[cleDescription]||'').trim() : '';

          if(cleMontant && cleType){
            var montant = parseMontant(String(ligne[cleMontant]));
            if(!(montant>0)) return;
            var type = String(ligne[cleType]).toLowerCase().indexOf('entr')!==-1 ? 'entree' : 'sortie';
            var categorie = cleCategorie ? trouverIdCategorieParNom(ligne[cleCategorie], type) : null;
            if(!categorie) categorie = type==='sortie' ? categoriserSortieReleve(description) : categoriserEntreeReleve(description);
            resultat.push({id:genId(), type:type, montant:Math.round(montant*100)/100, categorie:categorie, description:description, date:date});
          } else {
            var debit = cleDebit ? parseMontant(String(ligne[cleDebit])) : NaN;
            var credit = cleCredit ? parseMontant(String(ligne[cleCredit])) : NaN;
            if(debit > 0){
              resultat.push({id:genId(), type:'sortie', montant:Math.round(debit*100)/100, categorie:categoriserSortieReleve(description), description:description, date:date});
            } else if(credit > 0){
              resultat.push({id:genId(), type:'entree', montant:Math.round(credit*100)/100, categorie:categoriserEntreeReleve(description), description:description, date:date});
            }
          }
        });

        if(resultat.length === 0){ toast('Aucun mouvement exploitable dans ce fichier'); return; }
        var signaturesExistantes = {};
        state.transactions.forEach(function(t){ signaturesExistantes[signatureTransaction(t)] = true; });
        var nouvelles = resultat.filter(function(t){ return !signaturesExistantes[signatureTransaction(t)]; });
        var doublons = resultat.length - nouvelles.length;
        if(nouvelles.length===0){ toast('Tous les mouvements de ce fichier sont déjà importés'); return; }
        var message = nouvelles.length+' mouvement(s) à importer'+(doublons>0? ' ('+doublons+' déjà présents, ignorés)':'')+'. Continuer ?';
        if(!confirm(message)) return;
        state.transactions = state.transactions.concat(nouvelles);
        sauvegarder();
        render();
        toast(nouvelles.length+' mouvement(s) importé(s)');
      }catch(err){
        console.error('Erreur import Excel', err);
        toast('Fichier Excel invalide ou illisible');
      }
    };
    lecteur.readAsArrayBuffer(fichier);
    e.target.value = '';
  }

  // ---------- Synchronisation cloud (JSONBin) ----------
  function chargerIdentifiantsCloud(){
    return storageGetAvecRetry('budget-grandlivre-jsonbin').then(function(res){
      if(res && res.value){
        try{
          var data = JSON.parse(res.value);
          if(typeof data.masterKey === 'string') identifiantsCloud.masterKey = data.masterKey;
          if(typeof data.binId === 'string') identifiantsCloud.binId = data.binId;
        }catch(e){}
      }
    }).catch(function(){});
  }
  function sauvegarderIdentifiantsCloud(){
    return storageSetAvecRetry('budget-grandlivre-jsonbin', JSON.stringify(identifiantsCloud));
  }
  function envoyerVersJsonBin(){
    if(!identifiantsCloud.masterKey){ toast('Renseignez votre clé X-Master-Key'); return; }
    var estCreation = !identifiantsCloud.binId;
    var url = estCreation ? 'https://api.jsonbin.io/v3/b' : ('https://api.jsonbin.io/v3/b/'+identifiantsCloud.binId);
    toast(estCreation ? 'Création du bin…' : 'Envoi en cours…');
    fetch(url, {
      method: estCreation ? 'POST' : 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': identifiantsCloud.masterKey,
        'X-Bin-Name': 'grand-livre-budget'
      },
      body: JSON.stringify(state)
    }).then(function(res){
      if(!res.ok) throw new Error('HTTP '+res.status);
      return res.json();
    }).then(function(data){
      if(estCreation && data.metadata && data.metadata.id){
        identifiantsCloud.binId = data.metadata.id;
        sauvegarderIdentifiantsCloud();
        renderReglages();
      }
      toast('Envoyé vers le cloud');
    }).catch(function(e){
      console.error('Erreur envoi JSONBin', e);
      toast('Échec de l\'envoi — vérifiez la clé');
    });
  }
  function recupererDepuisJsonBin(){
    if(!identifiantsCloud.masterKey || !identifiantsCloud.binId){ toast('Clé et identifiant de bin requis'); return; }
    if(!confirm('Remplacer les données locales par celles du cloud ?')) return;
    toast('Récupération en cours…');
    fetch('https://api.jsonbin.io/v3/b/'+identifiantsCloud.binId+'/latest', {
      headers: { 'X-Master-Key': identifiantsCloud.masterKey }
    }).then(function(res){
      if(!res.ok) throw new Error('HTTP '+res.status);
      return res.json();
    }).then(function(data){
      var recu = data.record || {};
      if(Array.isArray(recu.transactions)) state.transactions = recu.transactions;
      if(Array.isArray(recu.categoriesSortie)) state.categoriesSortie = recu.categoriesSortie;
      if(Array.isArray(recu.categoriesEntree)) state.categoriesEntree = recu.categoriesEntree;
      if(typeof recu.objectifEpargne === 'number') state.objectifEpargne = recu.objectifEpargne;
      if(typeof recu.soldeInitial === 'number') state.soldeInitial = recu.soldeInitial;
      if(Array.isArray(recu.comptes)) state.comptes = recu.comptes;
      sauvegarder();
      render();
      toast('Données récupérées depuis le cloud');
    }).catch(function(e){
      console.error('Erreur récupération JSONBin', e);
      toast('Échec de la récupération — vérifiez la clé et l\'identifiant');
    });
  }

  // ---------- Import de relevé bancaire (CSV) ----------
  function detecterDelimiteurCSV(ligne){ return ligne.indexOf(';') !== -1 ? ';' : ','; }
  function parserLigneCSV(ligne, delimiteur){
    var champs = [];
    var champActuel = '';
    var dansGuillemets = false;
    for(var i=0;i<ligne.length;i++){
      var car = ligne[i];
      if(car === '"'){
        if(dansGuillemets && ligne[i+1] === '"'){ champActuel += '"'; i++; }
        else { dansGuillemets = !dansGuillemets; }
      } else if(car === delimiteur && !dansGuillemets){
        champs.push(champActuel);
        champActuel = '';
      } else {
        champActuel += car;
      }
    }
    champs.push(champActuel);
    return champs;
  }
  function convertirDateReleve(dateStr){
    var parts = (dateStr||'').split('/');
    if(parts.length !== 3) return null;
    var j = parts[0].padStart(2,'0'), m = parts[1].padStart(2,'0'), a = parts[2];
    if(a.length !== 4) return null;
    return a+'-'+m+'-'+j;
  }
  function categoriserSortieReleve(libelle){
    var l = libelle.toLowerCase();
    if(l.indexOf('livret cmb') !== -1) return 'epargne';
    if(['jutge nelly','jutge sarah','jutge simon','jutge nicolas','alvarez marie'].some(function(n){return l.indexOf(n)!==-1;})) return 'virements';
    if(l.indexOf('station u') !== -1 || l.indexOf('castel auto') !== -1) return 'transport';
    if(['sikkens','eau du bassin','alpiq','ikea'].some(function(k){return l.indexOf(k)!==-1;})) return 'logement';
    if(l.indexOf('ech pret') !== -1) return 'logement';
    if(['free telecom','bouygues telecom','canal+','deezerfr','cotisation eurocompte'].some(function(k){return l.indexOf(k)!==-1;})) return 'abonnements';
    if(['mma iard','suravenir'].some(function(k){return l.indexOf(k)!==-1;})) return 'assurances';
    if(l.indexOf('pharmacie') !== -1) return 'sante';
    if(['e.leclerc','carrefour','primeur','peltier','ticket res'].some(function(k){return l.indexOf(k)!==-1;})) return 'alimentation';
    if(['decathlon','tabac','ralli','express cafe','hedgard',"l'hermi",'normal saint','renversan','gars de la','helou','relay','bisc ','mamito'].some(function(k){return l.indexOf(k)!==-1;})) return 'loisirs';
    return 'autres';
  }
  function categoriserEntreeReleve(libelle){
    var l = libelle.toLowerCase();
    if(l.indexOf('livret cmb') !== -1) return 'virements';
    if(l.indexOf('compte cheques') !== -1) return 'virements';
    if(l.indexOf('jutge nicolas') !== -1 || l.indexOf('nicolas jutge') !== -1) return 'virements';
    if(l.indexOf('dgfip') !== -1) return 'remboursements';
    return 'autres-revenus';
  }
  function analyserReleveCSV(texte){
    if(!texte) return [];
    var lignes = texte.split(/\r?\n/).filter(function(l){ return l.trim().length>0; });
    if(lignes.length < 2) return [];
    var delimiteur = detecterDelimiteurCSV(lignes[0]);
    var entetes = parserLigneCSV(lignes[0], delimiteur).map(function(h){ return h.trim().toLowerCase().replace(/"/g,''); });
    var idxDate = entetes.findIndex(function(h){ return h.indexOf('date operation')!==-1 || h==='date'; });
    var idxLibelle = entetes.findIndex(function(h){ return h.indexOf('libelle')!==-1; });
    var idxDebit = entetes.findIndex(function(h){ return h.indexOf('debit')!==-1; });
    var idxCredit = entetes.findIndex(function(h){ return h.indexOf('credit')!==-1; });
    if(idxDate===-1 || idxLibelle===-1 || (idxDebit===-1 && idxCredit===-1)) return null;

    var resultat = [];
    for(var i=1;i<lignes.length;i++){
      var champs = parserLigneCSV(lignes[i], delimiteur);
      var dateStr = (champs[idxDate]||'').trim();
      var libelle = (champs[idxLibelle]||'').trim();
      var debit = idxDebit!==-1 ? parseMontant(champs[idxDebit]) : NaN;
      var credit = idxCredit!==-1 ? parseMontant(champs[idxCredit]) : NaN;
      var date = convertirDateReleve(dateStr);
      if(!date || !libelle) continue;

      if(debit > 0){
        resultat.push({id: genId(), type:'sortie', montant: Math.round(debit*100)/100, categorie: categoriserSortieReleve(libelle), description: libelle, date: date});
      } else if(credit > 0){
        resultat.push({id: genId(), type:'entree', montant: Math.round(credit*100)/100, categorie: categoriserEntreeReleve(libelle), description: libelle, date: date});
      }
    }
    return resultat;
  }
  function signatureTransaction(t){
    return t.date+'|'+t.type+'|'+t.montant.toFixed(2)+'|'+t.description;
  }
  function importerReleveCSV(e){
    var fichier = e.target.files[0];
    if(!fichier) return;
    var lecteur = new FileReader();
    lecteur.onload = function(evt){
      var transactions = analyserReleveCSV(evt.target.result);
      if(transactions === null){ toast('Format de relevé non reconnu'); return; }
      if(transactions.length === 0){ toast('Aucun mouvement trouvé dans ce fichier'); return; }
      var signaturesExistantes = {};
      state.transactions.forEach(function(t){ signaturesExistantes[signatureTransaction(t)] = true; });
      var nouvelles = transactions.filter(function(t){ return !signaturesExistantes[signatureTransaction(t)]; });
      var doublons = transactions.length - nouvelles.length;
      if(nouvelles.length===0){ toast('Tous les mouvements de ce fichier sont déjà importés'); return; }
      var message = nouvelles.length+' mouvement(s) à importer'+(doublons>0? ' ('+doublons+' déjà présents, ignorés)':'')+'. Continuer ?';
      if(!confirm(message)) return;
      state.transactions = state.transactions.concat(nouvelles);
      sauvegarder();
      render();
      toast(nouvelles.length+' mouvement(s) importé(s)');
    };
    lecteur.readAsText(fichier, 'UTF-8');
    e.target.value = '';
  }

  // ---------- Import CSV vers un compte d'épargne ----------
  // Ces trois fonctions réutilisent volontairement analyserReleveCSV/signatureTransaction tels
  // quels : un compte d'épargne fonctionne comme un second grand livre indépendant, alimenté par
  // SON PROPRE relevé bancaire (celui du compte d'épargne lui-même, pas celui du compte courant).
  // On ne recrée donc jamais artificiellement côté compte le virement déjà présent côté grand
  // livre principal (categorie = id du compte, voir remplirCategories) : ce serait compter deux
  // fois le même mouvement. Le lien entre les deux reste un simple étiquetage, pas une double
  // écriture automatique.
  function importerNouveauCompteCSV(e){
    var fichier = e.target.files[0];
    if(!fichier) return;
    var lecteur = new FileReader();
    lecteur.onload = function(evt){
      var transactions = analyserReleveCSV(evt.target.result);
      if(transactions === null){ toast('Format de relevé non reconnu'); e.target.value=''; return; }
      if(transactions.length === 0){ toast('Aucun mouvement trouvé dans ce fichier'); e.target.value=''; return; }
      var nom = prompt('Nom du nouveau compte d\'épargne :', 'Livret');
      if(!nom || !nom.trim()){ e.target.value=''; return; }
      var compte = {
        id: genId(),
        nom: nom.trim(),
        couleur: PALETTE_CATEGORIES[state.comptes.length % PALETTE_CATEGORIES.length],
        soldeInitial: 0,
        transactions: transactions,
        dateCreation: dateLocaleISO()
      };
      state.comptes.push(compte);
      compteOuvertId = compte.id;
      sauvegarder();
      renderReglages();
      render();
      toast('Compte « '+compte.nom+' » créé avec '+transactions.length+' mouvement(s)');
      e.target.value = '';
    };
    lecteur.readAsText(fichier, 'UTF-8');
  }
  function importerCsvDansCompte(e, compteId){
    var fichier = e.target.files[0];
    if(!fichier) return;
    var lecteur = new FileReader();
    lecteur.onload = function(evt){
      var compte = getCompte(compteId);
      if(!compte){ e.target.value=''; return; }
      var transactions = analyserReleveCSV(evt.target.result);
      if(transactions === null){ toast('Format de relevé non reconnu'); e.target.value=''; return; }
      if(transactions.length === 0){ toast('Aucun mouvement trouvé dans ce fichier'); e.target.value=''; return; }
      var signaturesExistantes = {};
      (compte.transactions||[]).forEach(function(t){ signaturesExistantes[signatureTransaction(t)] = true; });
      var nouvelles = transactions.filter(function(t){ return !signaturesExistantes[signatureTransaction(t)]; });
      var doublons = transactions.length - nouvelles.length;
      if(nouvelles.length===0){ toast('Tous les mouvements de ce fichier sont déjà importés'); e.target.value=''; return; }
      var message = nouvelles.length+' mouvement(s) à importer dans « '+compte.nom+' »'+(doublons>0? ' ('+doublons+' déjà présents, ignorés)':'')+'. Continuer ?';
      if(!confirm(message)){ e.target.value=''; return; }
      compte.transactions = (compte.transactions||[]).concat(nouvelles);
      sauvegarder();
      renderReglages();
      render();
      toast(nouvelles.length+' mouvement(s) importé(s) dans « '+compte.nom+' »');
      e.target.value = '';
    };
    lecteur.readAsText(fichier, 'UTF-8');
  }
  function creerCompteManuel(){
    var nom = prompt('Nom du nouveau compte d\'épargne :', 'Livret');
    if(!nom || !nom.trim()){ return; }
    var soldeSaisi = prompt('Solde de départ (laisser vide pour 0) :', '0');
    var solde = soldeSaisi==null || soldeSaisi.trim()==='' ? 0 : parseMontant(soldeSaisi);
    if(isNaN(solde)) solde = 0;
    var compte = {
      id: genId(),
      nom: nom.trim(),
      couleur: PALETTE_CATEGORIES[state.comptes.length % PALETTE_CATEGORIES.length],
      soldeInitial: solde,
      transactions: [],
      dateCreation: dateLocaleISO()
    };
    state.comptes.push(compte);
    compteOuvertId = compte.id;
    sauvegarder();
    renderReglages();
    render();
    toast('Compte « '+compte.nom+' » créé');
  }
  function supprimerCompte(id){
    var compte = getCompte(id);
    if(!compte) return;
    var enUsage = state.transactions.some(function(t){ return t.type==='sortie' && t.categorie===id; });
    if(enUsage){ toast('Des virements de votre grand livre pointent vers ce compte — recatégorisez-les avant de le supprimer'); return; }
    if(!confirm('Supprimer le compte « '+compte.nom+' » et tout son historique ? Cette action est irréversible.')) return;
    state.comptes = state.comptes.filter(function(c){ return c.id!==id; });
    if(compteOuvertId===id) compteOuvertId = null;
    sauvegarder();
    renderReglages();
    toast('Compte supprimé');
  }

  // ---------- Modal transaction ----------
  // Le sélecteur Compte du modal détermine où le mouvement est enregistré : state.transactions
  // (Courant, valeur "") ou compte.transactions d'un compte d'épargne (valeur = id du compte).
  function remplirComptesCible(){
    var select = document.getElementById('input-compte-cible');
    select.innerHTML = '<option value="">Courant</option>' +
      triAlpha(state.comptes).map(function(c){ return '<option value="'+c.id+'">'+escapeHtml(c.nom)+'</option>'; }).join('');
  }
  // Cherche une transaction par id d'abord dans le grand livre principal, puis dans chaque compte
  // d'épargne — retourne aussi l'id du compte source ("" pour le grand livre) pour savoir où
  // enregistrer/supprimer ensuite.
  function trouverTransactionEtSource(id){
    if(!id) return null;
    var t = state.transactions.find(function(x){return x.id===id;});
    if(t) return {transaction:t, compteId:''};
    for(var i=0;i<state.comptes.length;i++){
      var trouve = (state.comptes[i].transactions||[]).find(function(x){return x.id===id;});
      if(trouve) return {transaction:trouve, compteId:state.comptes[i].id};
    }
    return null;
  }
  // Un mouvement de compte d'épargne n'a ni catégorie ni récurrence (concepts propres au budget du
  // grand livre) : on masque ces champs quand un compte d'épargne est ciblé.
  function appliquerVisibiliteCompteCible(compteCibleId, transactionEditee){
    var estCompte = !!compteCibleId;
    document.getElementById('ligne-champ-categorie').style.display = estCompte ? 'none' : 'flex';
    document.getElementById('ligne-champ-recurrent').style.display = (estCompte || (transactionEditee && transactionEditee.recurrenceId)) ? 'none' : 'flex';
  }
  function remplirCategories(type){
    var select = document.getElementById('input-categorie');
    var cats = triAlpha(type==='sortie' ? state.categoriesSortie : state.categoriesEntree);
    var html = cats.map(function(c){ return '<option value="'+c.id+'">'+escapeHtml(c.nom)+'</option>'; }).join('');
    // Chaque compte d'épargne devient un item sélectionnable pour catégoriser une sortie comme
    // virement vers ce compte précis (au lieu du générique « Virements ») — voir getCategorie et
    // montantEpargnePeriode pour la résolution du libellé et la prise en compte comme épargne.
    if(type==='sortie' && state.comptes.length>0){
      html += '<optgroup label="Virement vers un compte d\'épargne">' +
        triAlpha(state.comptes).map(function(c){ return '<option value="'+c.id+'">'+escapeHtml(c.nom)+'</option>'; }).join('') +
      '</optgroup>';
    }
    select.innerHTML = html;
  }
  function ouvrirModal(transactionId){
    var modal = document.getElementById('modal-transaction');
    var form = document.getElementById('form-transaction');
    form.reset();
    document.getElementById('btn-supprimer-transaction').style.display = 'none';
    document.getElementById('input-id-transaction').value = '';
    document.getElementById('input-date').value = dateLocaleISO();
    document.getElementById('input-recurrence').value = 'aucune';
    document.querySelectorAll('.segment-type button').forEach(function(b){ b.classList.remove('actif'); });
    remplirComptesCible();
    var selectCompte = document.getElementById('input-compte-cible');
    selectCompte.disabled = false;

    var trouve = trouverTransactionEtSource(transactionId);
    var t = trouve ? trouve.transaction : null;
    var compteCibleId = trouve ? trouve.compteId : '';
    selectCompte.value = compteCibleId;
    document.getElementById('input-compte-source').value = compteCibleId;
    appliquerVisibiliteCompteCible(compteCibleId, t);

    var typeInitial = t ? t.type : 'sortie';
    var boutonType = document.querySelector('.segment-type button[data-type="'+typeInitial+'"]');
    if(boutonType) boutonType.classList.add('actif');
    document.getElementById('champ-type-actif').value = typeInitial;
    remplirCategories(typeInitial);

    if(t){
      document.getElementById('titre-modal').textContent = 'Modifier le mouvement';
      document.getElementById('input-id-transaction').value = t.id;
      document.getElementById('input-montant').value = String(t.montant).replace('.', ',');
      if(!compteCibleId) document.getElementById('input-categorie').value = t.categorie;
      document.getElementById('input-description').value = t.description || '';
      document.getElementById('input-date').value = t.date;
      document.getElementById('btn-supprimer-transaction').style.display = 'block';
      // On ne déplace pas un mouvement existant d'un compte à l'autre depuis ce sélecteur — il
      // reste là où il a été créé ; le modifier reviendrait à le supprimer puis le recréer ailleurs.
      selectCompte.disabled = true;
    } else {
      document.getElementById('titre-modal').textContent = 'Ajouter un mouvement';
    }
    modal.classList.add('modal--ouvert');
  }
  function fermerModal(){
    document.getElementById('modal-transaction').classList.remove('modal--ouvert');
  }

  // ---------- Toast ----------
  var toastTimer;
  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('toast--visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('toast--visible'); }, 2400);

  document.querySelectorAll('.tab-btn').forEach(function(btn){

  });
  document.querySelectorAll('.segment-type button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.segment-type button').forEach(function(b){ b.classList.remove('actif'); });
      btn.classList.add('actif');

      document.getElementById('champ-type-actif').value = type;
      remplirCategories(type);
    });
  });
  document.getElementById('form-transaction').addEventListener('submit', function(e){
    e.preventDefault();
    var id = document.getElementById('input-id-transaction').value;
    var type = document.getElementById('champ-type-actif').value;
    var montant = parseMontant(document.getElementById('input-montant').value);
    if(!(montant>0)){ toast('Montant invalide'); return; }
    var description = document.getElementById('input-description').value.trim();
    var date = document.getElementById('input-date').value || dateLocaleISO();
    var selectCompte = document.getElementById('input-compte-cible');
    var compteCible = selectCompte.disabled ? document.getElementById('input-compte-source').value : selectCompte.value;

    if(compteCible){
      // --- Mouvement d'un compte d'épargne : ni catégorie ni récurrence, propres au grand livre ---
      var compte = getCompte(compteCible);
      if(!compte){ toast('Compte introuvable'); return; }
      if(id){
        var tCompte = (compte.transactions||[]).find(function(x){return x.id===id;});
        if(tCompte){ tCompte.type=type; tCompte.montant=montant; tCompte.description=description; tCompte.date=date; }
        toast('Mouvement modifié');
      } else {
        compte.transactions = (compte.transactions||[]).concat([{id:genId(), type:type, montant:montant, description:description, date:date}]);
        toast('Mouvement ajouté à « '+compte.nom+' »');
      }
      fermerModal();
      sauvegarder();
      render();
      return;
    }

    var categorie = document.getElementById('input-categorie').value;

    if(id){
      var t = state.transactions.find(function(x){return x.id===id;});
      if(t){
        var categoriePrecedente = t.categorie;
        t.type=type; t.montant=montant; t.categorie=categorie; t.description=description; t.date=date;
        // Une série récurrente représente une seule et même charge/recette dans le temps : si sa
        // catégorie est corrigée sur une occurrence (ex. reclasser un abonnement mal catégorisé),
        // toutes les autres occurrences de la série (passées et futures, même recurrenceId) doivent
        // suivre — sinon la même charge se retrouve éclatée entre deux catégories dans Répartition.
        if(t.recurrenceId && categorie!==categoriePrecedente){
          state.transactions.forEach(function(autre){
            if(autre.recurrenceId===t.recurrenceId && autre.id!==t.id) autre.categorie = categorie;
          });
        }
        // Conversion en récurrent : uniquement possible si le mouvement n'appartient pas déjà à
        // une série (champ masqué dans ce cas — voir ouvrirModal). Réutilise le même générateur
        // que pour une création : comme il part de la date du mouvement (pas d'aujourd'hui), les
        // échéances passées entre cette date et aujourd'hui sont générées au même titre que les
        // futures, et impactent donc immédiatement le solde puisqu'elles ne sont plus à venir.
        var frequenceConv = t.recurrenceId ? 'aucune' : document.getElementById('input-recurrence').value;
        if(frequenceConv !== 'aucune'){
          t.recurrent = true;
          t.recurrenceId = t.id;
          t.recurrenceFrequence = frequenceConv;
          var occConv = genererOccurrencesRecurrentes(t, frequenceConv);
          state.transactions = state.transactions.concat(occConv);
          var aujourdhuiConv = dateLocaleISO();
          var nbPassees = occConv.filter(function(o){ return o.date <= aujourdhuiConv; }).length;
          var nbFutures = occConv.length - nbPassees;
          var detail = [];
          if(nbPassees>0) detail.push(nbPassees+' passée(s)');
          if(nbFutures>0) detail.push(nbFutures+' à venir');
          toast('Transformé en récurrent' + (detail.length ? (' — '+detail.join(' + ')+' générée(s)') : ''));
        } else {
          toast('Mouvement modifié');
        }
      }
    } else {
      var frequence = document.getElementById('input-recurrence').value;
      var nouvelle = {id: genId(), type:type, montant:montant, categorie:categorie, description:description, date:date};
      if(frequence !== 'aucune'){
        nouvelle.recurrent = true;
        nouvelle.recurrenceId = nouvelle.id;
        nouvelle.recurrenceFrequence = frequence;
        var occurrences = genererOccurrencesRecurrentes(nouvelle, frequence);
        state.transactions = state.transactions.concat(occurrences);
        state.transactions.push(nouvelle);
        var suffixe = frequence==='annuel' ? 'reconduite l\'an prochain' : 'jusqu\'à fin d\'année';
        toast(occurrences.length>0 ? ('Mouvement ajouté + '+occurrences.length+' échéance(s) '+suffixe) : 'Mouvement ajouté');
      } else {
        state.transactions.push(nouvelle);
        toast('Mouvement ajouté');
      }
    }
    fermerModal();
    sauvegarder();
    render();
  });
  document.getElementById('btn-supprimer-transaction').addEventListener('click', function(){
    var id = document.getElementById('input-id-transaction').value;
    if(!id) return;
    var compteSource = document.getElementById('input-compte-source').value;
    if(compteSource){
      var compte = getCompte(compteSource);
      if(!compte) return;
      if(!confirm('Supprimer ce mouvement ?')) return;
      compte.transactions = (compte.transactions||[]).filter(function(x){return x.id!==id;});
      fermerModal();
      sauvegarder();
      render();
      toast('Mouvement supprimé');
      return;
    }
    var t = state.transactions.find(function(x){return x.id===id;});
    if(!t) return;
    if(!confirm('Supprimer ce mouvement ?')) return;
    if(t.recurrenceId && confirm('Ce mouvement fait partie d\'une série récurrente. Supprimer aussi ses occurrences à venir (à partir de cette date) ?')){
      state.transactions = state.transactions.filter(function(x){ return !(x.recurrenceId===t.recurrenceId && x.date>=t.date); });
    } else {
      state.transactions = state.transactions.filter(function(x){return x.id!==id;});
    }
    fermerModal();
    sauvegarder();
    render();
    toast('Mouvement supprimé');
  });
  document.getElementById('barre-periode').addEventListener('click', function(e){
    var btn = e.target.closest('.chip-periode');
    if(!btn) return;
    state.periode = btn.dataset.periode;
    document.querySelectorAll('#barre-periode .chip-periode').forEach(function(b){ b.classList.toggle('actif', b===btn); });
    renderVueActive();
  });

  // ---------- Initialisation ----------
  function init(){
    var demarre = false;
    function demarrer(){
      if(demarre) return;
      demarre = true;
      document.querySelectorAll('#barre-periode .chip-periode').forEach(function(b){
        b.classList.toggle('actif', b.dataset.periode===state.periode);
      });
      document.getElementById('chargement').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      changerVue('dashboard');
    }
    setTimeout(demarrer, 12000); // filet de secours : l'appli s'ouvre de toute façon après 12s max
    chargerIdentifiantsCloud(); // indépendant, ne doit jamais retarder l'ouverture de l'appli
    chargerDonnees().then(function(){
      var nbRetirees = purgerOccurrencesHorsAnnee();
      var nbAjoutees = synchroniserRecurrences();
      if(nbRetirees>0 || nbAjoutees>0) sauvegarder();
      demarrer();
    }).catch(function(e){
      console.error('Erreur au chargement', e);
      demarrer();
    });
  }
  init();

  // Enregistrement du service worker : nécessaire pour l'installation PWA complète sur PC (Chrome/Edge).
  // Sauté dans l'aperçu Claude (window.storage présent) : cet environnement ne peut de toute façon pas
  // enregistrer de service worker (domaine non « app-bound »), la tentative ne ferait qu'ajouter une
  // ligne d'erreur inutile en console. Une fois le fichier déployé ailleurs (GitHub Pages, etc.),
  // l'enregistrement s'exécute normalement ; s'il échoue faute de sw.js à côté, ça reste silencieux pour
  // l'utilisateur — seule l'icône d'installation automatique ne sera pas proposée.
  if('serviceWorker' in navigator && !storageClaudeDisponible()){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(e){
        console.log('Service worker non enregistré (normal si sw.js n\'est pas déployé à côté de cette page) :', e);
      });
    });
  }
})();
</script>
